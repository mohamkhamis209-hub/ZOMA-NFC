<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZOMA Card</title><link rel="stylesheet" href="../assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script></head><body><header class="topbar"><a class="brand" href="../index.html"><span>Z</span>ZOMA</a><a class="btn sm" href="../customer/login.html">دخول</a></header><main id="app" class="profile"><div class="profilebox"><img id="photo" class="avatar" src="" style="display:none"><h1 id="name">جاري التحميل...</h1><p id="state" class="muted"></p><div id="socials" class="socials"></div><div class="actions" style="justify-content:center"><button class="btn sm" onclick="share()">مشاركة</button><button class="btn dark sm" onclick="saveContact()">حفظ جهة اتصال</button></div></div></main><script>
let card,profile;
function linkButton(label,url,event){if(!url)return"";return `<a class="social" href="${esc(url)}" target="_blank" rel="noopener" onclick="track('${card.card_id}','${event}')">${label}</a>`}
async function init(){let id=new URLSearchParams(location.search).get("id");if(!id){$("#name").textContent="رابط غير صحيح";return}card=await cardById(id);if(!card){$("#name").textContent="البطاقة غير موجودة";return}if(card.status==="unactivated"){location.href="../activation.html?id="+encodeURIComponent(id);return}if(card.status==="suspended"){$("#name").textContent="البطاقة موقوفة";$("#state").textContent="يرجى التواصل مع ZOMA";return}let r=await db.from("profiles").select("*").eq("card_id",card.id).maybeSingle();if(r.error){$("#name").textContent="تعذر تحميل البطاقة";return}profile=r.data||{};$("#name").textContent=profile.full_name||"ZOMA User";$("#state").textContent="ZOMA Smart Card";$("#socials").innerHTML=linkButton("Facebook",profile.facebook_url,"facebook_click")+linkButton("TikTok",profile.tiktok_url,"tiktok_click")+linkButton("WhatsApp 1",profile.whatsapp_1?`https://wa.me/${profile.whatsapp_1.replace(/\\D/g,"")}`:"","whatsapp_click")+(profile.show_whatsapp_2?linkButton("WhatsApp 2",profile.whatsapp_2?`https://wa.me/${profile.whatsapp_2.replace(/\\D/g,"")}`:"","whatsapp_click"):"");track(card.card_id,"profile_open",{referrer:document.referrer})}
async function share(){try{await navigator.share({title:profile.full_name||"ZOMA",url:location.href})}catch(_){await navigator.clipboard?.writeText(location.href);alert("تم نسخ الرابط")}}
function saveContact(){let vcard=`BEGIN:VCARD\\nVERSION:3.0\\nFN:${profile.full_name||""}\\nTEL:${profile.whatsapp_1||""}\\nTEL:${profile.whatsapp_2||""}\\nURL:${location.href}\\nEND:VCARD`;let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([vcard],{type:"text/vcard"}));a.download=(profile.full_name||"ZOMA")+".vcf";a.click()}
init();
</script></body></html>
