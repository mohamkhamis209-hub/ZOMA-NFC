<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZOMA Card</title><link rel="stylesheet" href="../assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script></head><body><main class="section"><div class="container"><div id="loading" class="center muted">جاري تحميل البطاقة…</div><section id="profile" class="panel profile-card" style="display:none"><img id="avatar" class="avatar" alt="صورة البطاقة"><div class="profile-name" id="name"></div><div class="muted" id="cardid"></div><div id="socials" class="socials"></div><div class="public-links" id="links"></div><div class="actions" style="justify-content:center;margin-top:18px"><button class="btn" id="save">حفظ جهة الاتصال</button><button class="btn" id="share">مشاركة</button></div></section></div></main><div id="toast" class="toast"></div><script>
const id=new URLSearchParams(location.search).get('id');async function boot(){if(!id){loading.textContent='رابط البطاقة غير صحيح';return}const {data,error}=await sb.rpc('zoma_get_public_card',{p_card_id:id});if(error||!data||!data[0]){loading.textContent='البطاقة غير موجودة';return}const p=data[0];if(p.status==='suspended'){loading.textContent='هذه البطاقة موقوفة';return}if(p.status==='unactivated'){location.href='../activation.html?id='+encodeURIComponent(id);return}name.textContent=p.full_name||'ZOMA User';cardid.textContent=p.card_id;avatar.src=p.photo_url||'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><rect width="100%" height="100%" rx="120" fill="#171b22"/><text x="50%" y="54%" text-anchor="middle" fill="#e8c46a" font-size="80" font-family="Arial">Z</text></svg>');const ss=[];if(p.facebook_url)ss.push(`<a class="btn" target="_blank" href="${zoma.escape(p.facebook_url)}">Facebook</a>`);if(p.tiktok_url)ss.push(`<a class="btn" target="_blank" href="${zoma.escape(p.tiktok_url)}">TikTok</a>`);if(p.whatsapp_1)ss.push(`<a class="btn success" target="_blank" href="${zoma.wa(p.whatsapp_1)}">WhatsApp</a>`);if(p.show_whatsapp_2&&p.whatsapp_2)ss.push(`<a class="btn success" target="_blank" href="${zoma.wa(p.whatsapp_2)}">WhatsApp 2</a>`);socials.innerHTML=ss.join('');links.innerHTML=ss.length?'':'<div class="muted">لا توجد روابط عامة مضافة.</div>';loading.style.display='none';profile.style.display='block';await sb.from('analytics').insert({card_id:p.card_uuid||null,event_type:'profile_view',source:'link',metadata:{card_id:id}});window.__p=p}boot();save.onclick=()=>{if(!window.__p)return;zoma.download((window.__p.full_name||'ZOMA')+'.vcf',zoma.vcard(window.__p))};share.onclick=async()=>{try{await navigator.share({title:'ZOMA Smart Card',text:window.__p?.full_name||'ZOMA Card',url:location.href})}catch(e){navigator.clipboard?.writeText(location.href);zoma.toast('تم نسخ الرابط','success')}};
</script></body></html>
