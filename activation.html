<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفعيل بطاقة ZOMA</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script></head><body><header class="topbar"><a class="brand" href="index.html"><span>Z</span>ZOMA</a></header><main class="auth"><div class="form panel"><h1>تفعيل بطاقتك</h1><p id="cid" class="muted"></p><div id="m" class="msg"></div><label>اسمك الظاهر</label><input id="name"><label>رابط Facebook</label><input id="fb"><label>رابط TikTok</label><input id="tt"><label>WhatsApp 1</label><input id="wa1"><label>WhatsApp 2</label><input id="wa2"><label>كلمة مرور حسابك</label><input id="pass" type="password"><label>إظهار WhatsApp 2 للعامة؟</label><select id="v2"><option value="true">نعم</option><option value="false">لا</option></select><button id="go" class="btn" style="width:100%;margin-top:18px">تفعيل البطاقة</button></div></main><script>
let card;async function init(){let id=new URLSearchParams(location.search).get("id");if(!id){showMsg($("#m"),"رابط البطاقة غير صحيح");return}card=await cardById(id);if(!card){showMsg($("#m"),"البطاقة غير موجودة");return}$("#cid").textContent=card.card_id;if(card.status==="suspended"){showMsg($("#m"),"هذه البطاقة موقوفة");$("#go").disabled=true}if(card.status==="active")location.href="card/index.html?id="+encodeURIComponent(id)}
$("#go").onclick=async()=>{try{let name=$("#name").value.trim(),pass=$("#pass").value;if(!name||pass.length<6)throw Error("اكتب الاسم وكلمة مرور 6 أحرف على الأقل.");let c=await getCustomer(card.customer_id);if(!c)throw Error("العميل غير موجود.");let r=await db.from("profiles").upsert({card_id:card.id,full_name:name,facebook_url:$("#fb").value.trim(),tiktok_url:$("#tt").value.trim(),whatsapp_1:$("#wa1").value.trim(),whatsapp_2:$("#wa2").value.trim(),show_whatsapp_2:$("#v2").value==="true"},{onConflict:"card_id"});if(r.error)throw r.error;let k=await db.from("cards").update({status:"active"}).eq("id",card.id);if(k.error)throw k.error;showMsg($("#m"),"تم تفعيل البطاقة بنجاح.","success");setTimeout(()=>location.href="card/index.html?id="+encodeURIComponent(card.card_id),900)}catch(e){showMsg($("#m"),e.message)}};
init();
</script></body></html>
