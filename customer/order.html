<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب بطاقة | ZOMA</title><link rel="stylesheet" href="../assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="dashboard.html"><span class="brand-badge">Z</span>ZOMA</a><div class="nav-actions"><a class="btn" href="dashboard.html">لوحة العميل</a><button class="btn" id="logout">خروج</button></div></div></header><main class="section"><div class="container"><div class="section-title"><h2>طلب بطاقة جديدة</h2><p>اختَر التصميم وأدخل بيانات التوصيل.</p></div><div class="two-col"><form id="f" class="panel order-card form"><div class="field"><label>التصميم</label><select id="design" required></select></div><div class="grid-2"><div class="field"><label>الاسم</label><input id="name" required></div><div class="field"><label>الهاتف</label><input id="phone" required></div><div class="field"><label>المحافظة</label><input id="gov" required></div><div class="field"><label>المدينة</label><input id="city" required></div></div><div class="field"><label>العنوان بالتفصيل</label><textarea id="address" rows="4" required></textarea></div><div class="field"><label>ملاحظات</label><textarea id="notes" rows="3"></textarea></div><div class="notice-box" id="price">السعر: —</div><button class="btn primary">إرسال الطلب</button></form><div class="panel order-card"><h3>قبل الإرسال</h3><p class="muted">بعد إرسال الطلب سيظهر في لوحة الإدارة، ويمكن للمشرف تأكيده وتجهيز البطاقة ثم ربطها بحسابك.</p><div class="notice">للطلب أو التواصل مع ZOMA: <b>01033459821</b></div></div></div></div></main><script>
let designs=[];zoma.$('#logout').onclick=zoma.signOut;async function boot(){const u=await zoma.currentUser();if(!u){location.href='login.html';return}const {data:c}=await sb.from('customers').select('*').eq('id',u.id).single();if(!c){zoma.toast('بيانات العميل غير موجودة','error');return}name.value=c.full_name||'';phone.value=c.phone||'';const r=await sb.from('designs').select('*').eq('is_available',true).order('created_at');designs=r.data||[];design.innerHTML=designs.map(d=>`<option value="${d.id}">${zoma.escape(d.name)} — ${zoma.money(d.price)}</option>`).join('');updatePrice()}function updatePrice(){const d=designs.find(x=>x.id===design.value);price.textContent=d?'السعر: '+zoma.money(d.price):'السعر: —'}design.onchange=updatePrice;f.addEventListener('submit',async e=>{e.preventDefault();const u=await zoma.currentUser();const d=designs.find(x=>x.id===design.value);const order_number=zoma.orderNo();const {data,error}=await sb.from('orders').insert({customer_id:u.id,design_id:d.id,order_number,total_price:d.price,customer_name:name.value,phone:phone.value,shipping_governorate:gov.value,shipping_city:city.value,shipping_address:address.value,customer_notes:notes.value,status:'pending'}).select().single();if(error){zoma.toast(error.message,'error');return}await zoma.log('create_order','order',data.id,{order_number});zoma.toast('تم إرسال الطلب بنجاح','success');location.href='dashboard.html'});boot();
</script></body></html>
