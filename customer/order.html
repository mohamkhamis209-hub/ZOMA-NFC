<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب بطاقة ZOMA</title><link rel="stylesheet" href="../assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script></head><body><header class="topbar"><a class="brand" href="../index.html"><span>Z</span>ZOMA</a><a href="dashboard.html">حسابي</a></header><main class="container section"><div class="form panel" style="margin:auto"><h1>طلب بطاقة</h1><div id="m" class="msg"></div><label>اسم الاستلام</label><input id="name"><label>هاتف الاستلام</label><input id="phone"><label>عنوان الشحن</label><textarea id="address"></textarea><label>التصميم</label><select id="design"></select><label>ملاحظات</label><textarea id="notes"></textarea><button id="go" class="btn" style="width:100%;margin-top:17px">إرسال الطلب</button></div></main><script>
async function init(){try{let u=await requireAuth("login.html");if(!u)return;let c=await getCustomer(u.id);if(c){$("#name").value=c.full_name||"";$("#phone").value=c.phone||""}let r=await db.from("designs").select("*").eq("is_available",true).order("name");if(r.error)throw r.error;$("#design").innerHTML=(r.data||[]).map(d=>`<option value="${d.id}" data-price="${d.price}">${esc(d.name)} — ${money(d.price)}</option>`).join("")}catch(e){showMsg($("#m"),e.message)}}
$("#go").onclick=async()=>{try{let u=await getUser(),d=$("#design").selectedOptions[0],number="ZOMA-"+Math.floor(1000+Math.random()*9000);let r=await db.from("orders").insert({order_number:number,customer_id:u.id,design_id:$("#design").value,status:"pending_review",shipping_name:$("#name").value.trim(),shipping_phone:$("#phone").value.trim(),shipping_address:$("#address").value.trim(),notes:$("#notes").value.trim(),total_price:Number(d.dataset.price||0)}).select().single();if(r.error)throw r.error;showMsg($("#m"),"تم إرسال الطلب: "+number,"success");$("#go").disabled=true}catch(e){showMsg($("#m"),e.message)}};init();
</script></body></html>
