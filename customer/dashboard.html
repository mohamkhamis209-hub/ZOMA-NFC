```html
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>لوحة العميل | ZOMA</title>

  <link rel="stylesheet" href="../assets/css/style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ZOMA Config -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/app.js"></script>
</head>

<body>

<header class="topbar">
  <div class="container nav">

    <a class="brand" href="../index.html">
      <span class="brand-badge">Z</span>
      ZOMA
    </a>

    <div class="nav-actions">
      <a class="btn primary" href="order.html">طلب بطاقة</a>
      <button class="btn" id="logout" type="button">خروج</button>
    </div>

  </div>
</header>


<main class="section">
  <div class="container">

    <!-- Dashboard Header -->
    <div class="dash-top">
      <div>
        <h1>
          أهلاً
          <span id="hello"></span>
          👋
        </h1>

        <p class="muted">
          إدارة بياناتك وبطاقاتك وطلباتك.
        </p>
      </div>
    </div>


    <!-- Profile + Cards -->
    <div class="two-col">

      <!-- Profile -->
      <section class="panel order-card">

        <h2>بيانات الملف</h2>

        <form id="profileForm" class="form">

          <div class="field">
            <label for="full_name">الاسم</label>
            <input id="full_name" type="text">
          </div>


          <div class="grid-2">

            <div class="field">
              <label for="facebook_url">Facebook</label>
              <input id="facebook_url" type="url">
            </div>


            <div class="field">
              <label for="tiktok_url">TikTok</label>
              <input id="tiktok_url" type="url">
            </div>


            <div class="field">
              <label for="whatsapp_1">WhatsApp 1</label>
              <input id="whatsapp_1" type="text">
            </div>


            <div class="field">
              <label for="whatsapp_2">WhatsApp 2</label>
              <input id="whatsapp_2" type="text">
            </div>

          </div>


          <div class="field">

            <label for="show_whatsapp_2">
              إظهار واتساب 2
            </label>

            <select id="show_whatsapp_2">

              <option value="true">
                نعم
              </option>

              <option value="false">
                لا
              </option>

            </select>

          </div>


          <div class="field">

            <label for="photo">
              الصورة
            </label>

            <input
              id="photo"
              type="file"
              accept="image/*"

          </div>


          <button
            class="btn primary"
            type="submit"

            حفظ التعديلات
          </button>

        </form>

      </section>


      <!-- Cards -->
      <section class="panel order-card">

        <h2>بطاقاتي</h2>

        <div id="cards"></div>

      </section>

    </div>


    <!-- Messages -->
    <section
      class="panel order-card"
      style="margin-top:16px"
    >

      <h2>
        تواصل مع ZOMA
      </h2>


      <form
        id="msgForm"
        class="form"
      >

        <div class="field">

          <label for="msgSubject">
            الموضوع
          </label>

          <input
            id="msgSubject"
            type="text"
            required
          >

        </div>


        <div class="field">

          <label for="msgBody">
            الرسالة
          </label>

          <textarea

          ></textarea>

        <button

      </form>

    </section>


    <!-- Orders -->
    <section

      style="margin-top:16px"
    >

      <div class="toolbar">

        <h2>
          طلباتي
        </h2>

        <a
          class="btn"
          href="order.html"
        >
          طلب جديد
        </a>

      </div>


      <div class="table-wrap">

        <table class="table">

          <thead>

            <tr>
              <th>الطلب</th>
              <th>التصميم</th>
              <th>السعر</th>
              <th>الحالة</th>
              <th>ملاحظات الإدارة</th>

          </thead>


          <tbody id="orders"></tbody>

    </section>

  </div>
</main>



<script>

"use strict";


/* =========================================================
   DOM ELEMENTS
========================================================= */

const logoutBtn = document.getElementById("logout");

const helloEl = document.getElementById("hello");

const fullNameEl = document.getElementById("full_name");

const facebookEl = document.getElementById("facebook_url");

const tiktokEl = document.getElementById("tiktok_url");

const whatsapp1El = document.getElementById("whatsapp_1");

const whatsapp2El = document.getElementById("whatsapp_2");

const showWhatsapp2El =
  document.getElementById("show_whatsapp_2");

const photoEl =
  document.getElementById("photo");

const profileForm =
  document.getElementById("profileForm");

const cardsEl =
  document.getElementById("cards");

const msgForm =
  document.getElementById("msgForm");

const msgSubjectEl =
  document.getElementById("msgSubject");

const msgBodyEl =
  document.getElementById("msgBody");

const myMessagesEl =
  document.getElementById("myMessages");

const ordersEl =
  document.getElementById("orders");


/* =========================================================
   VARIABLES
========================================================= */

let user = null;

let cardRows = [];


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener("click", async () => {

  try {

    await zoma.signOut();

  } catch (error) {

    console.error("Logout error:", error);

    if (typeof zoma.toast === "function") {

      zoma.toast(
        error.message || "حدث خطأ أثناء تسجيل الخروج",
        "error"
      );

    }

  }

});


/* =========================================================
   LOAD DASHBOARD
========================================================= */

async function boot() {

  try {

    /* -----------------------------------------------------
       Check logged-in user
    ----------------------------------------------------- */

    user = await zoma.currentUser();


    if (!user) {

      window.location.href = "login.html";

      return;

    }


    /* -----------------------------------------------------
       Customer
    ----------------------------------------------------- */

    const customerResult =
      await sb
        .from("customers")
        .select("*")
        .eq("id", user.id)
        .single();


    if (customerResult.error) {

      console.error(
        "Customer error:",
        customerResult.error
      );

    }


    const customer =
      customerResult.data;


    if (customer) {

      const customerName =
        customer.full_name || "";


      helloEl.textContent =
        customerName;


      fullNameEl.value =
        customerName;

    }


    /* -----------------------------------------------------
       Get customer cards
    ----------------------------------------------------- */

    const cardsResult =
      await sb
        .from("cards")
        .select("id")
        .eq("customer_id", user.id);


    if (cardsResult.error) {

      throw cardsResult.error;

    }


    const customerCardIds =
      (cardsResult.data || [])
        .map(card => card.id);


    /* -----------------------------------------------------
       Get profiles
    ----------------------------------------------------- */

    let profiles = [];


    if (customerCardIds.length > 0) {

      const profilesResult =
        await sb
          .from("profiles")
          .select("*")
          .in(
            "card_id",
            customerCardIds
          );


      if (profilesResult.error) {

        console.error(
          "Profiles error:",
          profilesResult.error
        );

      } else {

        profiles =
          profilesResult.data || [];

      }

    }


    /* -----------------------------------------------------
       Fill profile
    ----------------------------------------------------- */

    if (profiles.length > 0) {

      const profile =
        profiles[0];


      fullNameEl.value =
        profile.full_name ||
        fullNameEl.value ||
        "";


      facebookEl.value =
        profile.facebook_url ||
        "";


      tiktokEl.value =
        profile.tiktok_url ||
        "";


      whatsapp1El.value =
        profile.whatsapp_1 ||
        "";


      whatsapp2El.value =
        profile.whatsapp_2 ||
        "";


      showWhatsapp2El.value =
        String(
          profile.show_whatsapp_2 !== false
        );

    }


    /* -----------------------------------------------------
       Get cards
    ----------------------------------------------------- */

    const cardsFullResult =
      await sb
        .from("cards")
        .select(
          "*,orders(order_number,designs(name))"
        )
        .eq("customer_id", user.id)
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (cardsFullResult.error) {

      throw cardsFullResult.error;

    }


    cardRows =
      cardsFullResult.data || [];


    /* -----------------------------------------------------
       Display cards
    ----------------------------------------------------- */

    if (cardRows.length > 0) {

      cardsEl.innerHTML =
        cardRows
          .map(card => {

            const publicUrl =
              card.public_url || "";


            const cardId =
              zoma.escape(
                card.card_id || ""
              );


            const status =
              zoma.statusLabel(
                card.status
              );


            return `

              <div
                class="notice-box"
                style="margin-bottom:10px"
              >

                <b>${cardId}</b>

                <div class="muted">
                  ${status}
                </div>


                <div
                  class="actions"
                  style="margin-top:9px"
                >

                  <a
                    class="btn"
                    target="_blank"
                    rel="noopener noreferrer"
                    href="${publicUrl}"
                  >
                    فتح البطاقة
                  </a>


                  <button
                    class="btn copy-card-link"
                    type="button"
                    data-url="${encodeURIComponent(publicUrl)}"
                  >
                    نسخ الرابط
                  </button>

                </div>

              </div>

            `;

          })
          .join("");

    } else {

      cardsEl.innerHTML =
        '<div class="empty">لا توجد بطاقات حتى الآن.</div>';

    }


    /* -----------------------------------------------------
       Copy card links
    ----------------------------------------------------- */

    document
      .querySelectorAll(".copy-card-link")
      .forEach(button => {

        button.addEventListener(
          "click",
          async () => {

            try {

              const url =
                decodeURIComponent(
                  button.dataset.url || ""
                );


              if (!url) {

                throw new Error(
                  "رابط البطاقة غير موجود"
                );

              }


              await navigator.clipboard.writeText(
                url
              );


              if (
                typeof zoma.toast ===
                "function"
              ) {

                zoma.toast(
                  "تم نسخ الرابط",
                  "success"
                );

              }

            } catch (error) {

              console.error(
                "Copy error:",
                error
              );


              if (
                typeof zoma.toast ===
                "function"
              ) {

                zoma.toast(
                  "تعذر نسخ الرابط",
                  "error"
                );

              }

            }

          }
        );

      });


    /* -----------------------------------------------------
       Get orders
    ----------------------------------------------------- */

    const ordersResult =
      await sb
        .from("orders")
        .select("*,designs(name)")
        .eq("customer_id", user.id)
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (ordersResult.error) {

      throw ordersResult.error;

    }


    const orders =
      ordersResult.data || [];


    /* -----------------------------------------------------
       Display orders
    ----------------------------------------------------- */

    if (orders.length > 0) {

      ordersEl.innerHTML =
        orders
          .map(order => {

            const orderNumber =
              zoma.escape(
                order.order_number || "—"
              );


            const designName =
              zoma.escape(
                order.designs?.name || "—"
              );


            const price =
              zoma.money(
                order.total_price
              );


            const statusClass =
              zoma.statusClass(
                order.status
              );


            const statusLabel =
              zoma.statusLabel(
                order.status
              );


            const adminNotes =
              zoma.escape(
                order.admin_notes || "—"
              );


            return `

              <tr>

                <td>
                  ${orderNumber}
                </td>

                <td>
                  ${designName}
                </td>

                <td>
                  ${price}
                </td>

                <td>

                  <span
                    class="status ${statusClass}"
                  >
                    ${statusLabel}
                  </span>

                </td>

                <td>
                  ${adminNotes}
                </td>

              </tr>

            `;

          })
          .join("");

    } else {

      ordersEl.innerHTML = `

        <tr>

          <td
            colspan="5"
            class="empty"
          >
            لا توجد طلبات.
          </td>

        </tr>

      `;

    }


    /* -----------------------------------------------------
       Get messages
    ----------------------------------------------------- */

    const messagesResult =
      await sb
        .from("messages")
        .select("*")
        .eq("customer_id", user.id)
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (messagesResult.error) {

      throw messagesResult.error;

    }


    const messages =
      messagesResult.data || [];


    /* -----------------------------------------------------
       Display messages
    ----------------------------------------------------- */

    if (messages.length > 0) {

      myMessagesEl.innerHTML =
        messages
          .map(message => {

            const subject =
              zoma.escape(
                message.subject ||
                "بدون موضوع"
              );


            const body =
              zoma.escape(
                message.body || ""
              );


            const reply =
              zoma.escape(
                message.admin_reply ||
                "بانتظار الرد"
              );


            return `

              <div
                class="notice-box"
                style="margin-bottom:8px"
              >

                <b>
                  ${subject}
                </b>

                <div>
                  ${body}
                </div>

                <div class="muted">
                  ${reply}
                </div>

              </div>

            `;

          })
          .join("");

    } else {

      myMessagesEl.innerHTML =
        '<div class="muted">لا توجد رسائل.</div>';

    }


  } catch (error) {

    console.error(
      "Dashboard boot error:",
      error
    );


    if (
      typeof zoma.toast ===
      "function"
    ) {

      zoma.toast(
        error.message ||
        "حدث خطأ أثناء تحميل لوحة العميل",
        "error"
      );

    }

  }

}


/* =========================================================
   SAVE PROFILE
========================================================= */

profileForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    try {

      /* ---------------------------------------------------
         Find first card
      --------------------------------------------------- */

      const cardResult =
        await sb
          .from("cards")
          .select("id")
          .eq("customer_id", user.id)
          .order(
            "created_at",
            {
              ascending: true
            }
          )
          .limit(1)
          .maybeSingle();


      if (cardResult.error) {

        throw cardResult.error;

      }


      const card =
        cardResult.data;


      if (!card) {

        zoma.toast(
          "أنشئ طلبًا أولاً حتى يتم إنشاء بطاقة",
          "error"
        );

        return;

      }


      /* ---------------------------------------------------
         Upload photo
      --------------------------------------------------- */

      let photoUrl = null;


      const file =
        photoEl.files &&
        photoEl.files[0];


      if (file) {

        try {

          photoUrl =
            await zoma.uploadPhoto(file);

        } catch (error) {

          zoma.toast(
            error.message ||
            "تعذر رفع الصورة",
            "error"
          );

          return;

        }

      }


      /* ---------------------------------------------------
         Profile payload
      --------------------------------------------------- */

      const payload = {

        card_id:
          card.id,

        full_name:
          fullNameEl.value.trim(),

        facebook_url:
          facebookEl.value.trim(),

        tiktok_url:
          tiktokEl.value.trim(),

        whatsapp_1:
          whatsapp1El.value.trim(),

        whatsapp_2:
          whatsapp2El.value.trim(),

        show_whatsapp_2:
          showWhatsapp2El.value === "true"

      };


      if (photoUrl) {

        payload.photo_url =
          photoUrl;

      }


      /* ---------------------------------------------------
         Save profile
      --------------------------------------------------- */

      const profileResult =
        await sb
          .from("profiles")
          .upsert(
            payload,
            {
              onConflict:
                "card_id"
            }
          );


      if (profileResult.error) {

        throw profileResult.error;

      }


      /* ---------------------------------------------------
         Update customer name
      --------------------------------------------------- */

      const customerUpdate =
        await sb
          .from("customers")
          .update({
            full_name:
              fullNameEl.value.trim()
          })
          .eq(
            "id",
            user.id
          );


      if (customerUpdate.error) {

        console.error(
          "Customer update error:",
          customerUpdate.error
        );

      }


      /* ---------------------------------------------------
         Update greeting
      --------------------------------------------------- */

      helloEl.textContent =
        fullNameEl.value.trim();


      /* ---------------------------------------------------
         Success
      --------------------------------------------------- */

      zoma.toast(
        "تم حفظ البيانات",
        "success"
      );


    } catch (error) {

      console.error(
        "Profile save error:",
        error
      );


      zoma.toast(
        error.message ||
        "حدث خطأ أثناء حفظ البيانات",
        "error"
      );

    }

  }
);


/* =========================================================
   SEND MESSAGE
========================================================= */

msgForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    try {

      const subject =
        msgSubjectEl.value.trim();


      const body =
        msgBodyEl.value.trim();


      if (!subject || !body) {

        zoma.toast(
          "اكتب الموضوع والرسالة أولاً",
          "error"
        );

        return;

      }


      const result =
        await sb
          .from("messages")
          .insert({

            customer_id:
              user.id,

            subject:
              subject,

            body:
              body

          });


      if (result.error) {

        throw result.error;

      }


      /* ---------------------------------------------------
         Clear form
      --------------------------------------------------- */

      msgSubjectEl.value = "";

      msgBodyEl.value = "";


      zoma.toast(
        "تم إرسال الرسالة",
        "success"
      );


      /* ---------------------------------------------------
         Reload dashboard messages
      --------------------------------------------------- */

      await boot();


    } catch (error) {

      console.error(
        "Message error:",
        error
      );


      zoma.toast(
        error.message ||
        "حدث خطأ أثناء إرسال الرسالة",
        "error"
      );

    }

  }
);


/* =========================================================
   START
========================================================= */

boot();

</script>

</body>
</html>
```
