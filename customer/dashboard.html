<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي - ZOMA</title><link rel="stylesheet" href="../assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script></head><body><header class="topbar"><a class="brand" href="../index.html"><span>Z</span>ZOMA</a><nav class="nav"><a class="btn sm" href="order.html">طلب جديد</a><button class="btn dark sm" onclick="signOut()">خروج</button></nav></header><main class="container section"><h1 id="hello">حسابي</h1><div id="m" class="msg"></div><div class="grid3"><div class="feature"><h3>بياناتي</h3><p id="info">—</p><button class="btn sm" onclick="editProfile()">تعديل</button></div><div class="feature"><h3>بطاقاتي</h3><p id="cards">جاري التحميل...</p></div><div class="feature"><h3>الطلبات</h3><p id="orders">جاري التحميل...</p></div></div><section class="section" style="padding-bottom:20px"><h2>طلباتي</h2><div class="panel table-wrap"><table class="table"><thead><tr><th>الطلب</th><th>التصميم</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let U,C;
async function init(){U=await requireAuth("login.html");if(!U)return;C=await getCustomer(U.id);$("#hello").textContent="أهلاً "+(C?.full_name||"");$("#info").innerHTML=`${esc(C?.full_name)}<br>${esc(C?.phone)}`;let [o,k]=await Promise.all([db.from("orders").select("*,designs(name)").eq("customer_id",U.id).order("created_at",{ascending:false}),db.from("cards").select("*").eq("customer_id",U.id).order("created_at",{ascending:false})]);if(o.error||k.error){showMsg($("#m"),(o.error||k.error).message);return}$("#orders").textContent=o.data.length;$("#cards").textContent=k.data.length;$("#rows").innerHTML=o.data.map(x=>`<tr><td>${esc(x.order_number)}</td><td>${esc(x.designs?.name||"—")}</td><td>${statusText(x.status)}</td><td>${fmt(x.created_at)}</td></tr>`).join("")||"<tr><td colspan=4>لا توجد طلبات.</td></tr>"}
async function editProfile(){let n=prompt("الاسم",C.full_name);if(n===null)return;let p=prompt("الهاتف",C.phone);if(p===null)return;let r=await db.from("customers").update({full_name:n,phone:p}).eq("id",U.id);if(r.error)alert(r.error.message);else init()}
init();
</script></body></html>
