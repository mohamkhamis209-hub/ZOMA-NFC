<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة العميل | ZOMA</title><link rel="stylesheet" href="../assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="../index.html"><span class="brand-badge">Z</span>ZOMA</a><div class="nav-actions"><a class="btn primary" href="order.html">طلب بطاقة</a><button class="btn" id="logout">خروج</button></div></div></header><main class="section"><div class="container"><div class="dash-top"><div><h1>أهلاً <span id="hello"></span> 👋</h1><p class="muted">إدارة بياناتك وبطاقاتك وطلباتك.</p></div></div><div class="two-col"><section class="panel order-card"><h2>بيانات الملف</h2><form id="profileForm" class="form"><div class="field"><label>الاسم</label><input id="full_name"></div><div class="grid-2"><div class="field"><label>Facebook</label><input id="facebook_url"></div><div class="field"><label>TikTok</label><input id="tiktok_url"></div><div class="field"><label>WhatsApp 1</label><input id="whatsapp_1"></div><div class="field"><label>WhatsApp 2</label><input id="whatsapp_2"></div></div><div class="field"><label>إظهار واتساب 2</label><select id="show_whatsapp_2"><option value="true">نعم</option><option value="false">لا</option></select></div><div class="field"><label>الصورة</label><input id="photo" type="file" accept="image/*"></div><button class="btn primary">حفظ التعديلات</button></form></section><section class="panel order-card"><h2>بطاقاتي</h2><div id="cards"></div></section></div><section class="panel order-card" style="margin-top:16px"><h2>تواصل مع ZOMA</h2><form id="msgForm" class="form"><div class="field"><label>الموضوع</label><input id="msgSubject" required></div><div class="field"><label>الرسالة</label><textarea id="msgBody" rows="4" required></textarea></div><button class="btn primary">إرسال</button></form><div id="myMessages" style="margin-top:16px"></div></section><section class="panel order-card" style="margin-top:16px"><div class="toolbar"><h2>طلباتي</h2><a class="btn" href="order.html">طلب جديد</a></div><div class="table-wrap"><table class="table"><thead><tr><th>الطلب</th><th>التصميم</th><th>السعر</th><th>الحالة</th><th>ملاحظات الإدارة</th></tr></thead><tbody id="orders"></tbody></table></div></section></div></main><script>
let user,cardRows=[];$('#logout').onclick=zoma.signOut;async function boot(){user=await zoma.currentUser();if(!user){location.href='login.html';return}const c=(await sb.from('customers').select('*').eq('id',user.id).single()).data;if(c){hello.textContent=zoma.escape(c.full_name||'');full_name.value=c.full_name||'';phone=c.phone||''}const p=(await sb.from('profiles').select('*').in('card_id',(await sb.from('cards').select('id').eq('customer_id',user.id)).data?.map(x=>x.id)||[])).data||[];if(p[0]){full_name.value=p[0].full_name||full_name.value;facebook_url.value=p[0].facebook_url||'';tiktok_url.value=p[0].tiktok_url||'';whatsapp_1.value=p[0].whatsapp_1||'';whatsapp_2.value=p[0].whatsapp_2||'';show_whatsapp_2.value=String(p[0].show_whatsapp_2!==false)}const cr=await sb.from('cards').select('*,orders(order_number,designs(name))').eq('customer_id',user.id).order('created_at',{ascending:false});cardRows=cr.data||[];cards.innerHTML=cardRows.length?cardRows.map(c=>`<div class="notice-box" style="margin-bottom:10px"><b>${c.card_id}</b><div class="muted">${zoma.statusLabel(c.status)}</div><div class="actions" style="margin-top:9px"><a class="btn" target="_blank" href="${c.public_url}">فتح البطاقة</a><button class="btn" onclick="navigator.clipboard.writeText('${c.public_url}').then(()=>zoma.toast('تم نسخ الرابط','success'))">نسخ الرابط</button></div></div>`).join(''):'<div class="empty">لا توجد بطاقات حتى الآن.</div>';const or=await sb.from('orders').select('*,designs(name)').eq('customer_id',user.id).order('created_at',{ascending:false});const mym=(await sb.from('messages').select('*').eq('customer_id',user.id).order('created_at',{ascending:false})).data||[];myMessages.innerHTML=mym.length?mym.map(m=>`<div class="notice-box" style="margin-bottom:8px"><b>${zoma.escape(m.subject||'بدون موضوع')}</b><div>${zoma.escape(m.body)}</div><div class="muted">${zoma.escape(m.admin_reply||'بانتظار الرد')}</div></div>`).join(''):'<div class="muted">لا توجد رسائل.</div>';orders.innerHTML=(or.data||[]).map(o=>`<tr><td>${o.order_number}</td><td>${zoma.escape(o.designs?.name||'—')}</td><td>${zoma.money(o.total_price)}</td><td><span class="status ${zoma.statusClass(o.status)}">${zoma.statusLabel(o.status)}</span></td><td>${zoma.escape(o.admin_notes||'—')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد طلبات.</td></tr>'}profileForm.addEventListener('submit',async e=>{e.preventDefault();const card=(await sb.from('cards').select('id').eq('customer_id',user.id).order('created_at',{ascending:true}).limit(1).maybeSingle()).data;if(!card){zoma.toast('أنشئ طلبًا أولاً حتى يتم إنشاء بطاقة','error');return}let photo_url;const file=photo.files[0];if(file)try{photo_url=await zoma.uploadPhoto(file)}catch(err){zoma.toast(err.message,'error');return}const payload={card_id:card.id,full_name:full_name.value,facebook_url:facebook_url.value,tiktok_url:tiktok_url.value,whatsapp_1:whatsapp_1.value,whatsapp_2:whatsapp_2.value,show_whatsapp_2:show_whatsapp_2.value==='true'};if(photo_url)payload.photo_url=photo_url;const {error}=await sb.from('profiles').upsert(payload,{onConflict:'card_id'});if(error){zoma.toast(error.message,'error');return}await sb.from('customers').update({full_name:full_name.value}).eq('id',user.id);zoma.toast('تم حفظ البيانات','success')});msgForm.addEventListener('submit',async e=>{e.preventDefault();const {error}=await sb.from('messages').insert({customer_id:user.id,subject:msgSubject.value,body:msgBody.value});if(error)zoma.toast(error.message,'error');else{msgSubject.value='';msgBody.value='';zoma.toast('تم إرسال الرسالة','success');boot()}});boot();
</script></body></html>
