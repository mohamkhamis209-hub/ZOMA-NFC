<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول العميل | ZOMA</title><link rel="stylesheet" href="../assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script></head><body><div class="auth-wrap"><div class="panel auth"><a class="brand" href="../index.html"><span class="brand-badge">Z</span>ZOMA</a><h1>تسجيل دخول العميل</h1><p class="muted">يمكنك الدخول برقم الهاتف أو رقم البطاقة أو البريد الداخلي للحساب.</p><form id="f" class="form"><div class="field"><label>الهاتف / رقم البطاقة / البريد</label><input id="identity" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div><button class="btn primary">دخول</button></form><div class="help">ليس لديك حساب؟ <a class="link" href="register.html">إنشاء حساب</a></div><div class="help"><a class="link" href="../index.html">العودة للرئيسية</a></div></div></div><script>
const form=zoma.$('#f');form.addEventListener('submit',async e=>{e.preventDefault();const identity=zoma.$('#identity').value.trim(),password=zoma.$('#password').value;let email=identity;if(!identity.includes('@')){const {data,error}=await sb.rpc('zoma_get_login_email',{p_identity:identity});if(error||!data){zoma.toast('البيانات غير صحيحة','error');return}email=data}const {error}=await sb.auth.signInWithPassword({email,password});if(error){zoma.toast(error.message,'error');return}location.href='dashboard.html'});
</script></body></html>
