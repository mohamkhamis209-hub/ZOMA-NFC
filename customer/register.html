<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب</title><link rel="stylesheet" href="../assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script></head><body><header class="topbar"><a class="brand" href="../index.html"><span>Z</span>ZOMA</a></header><main class="auth"><div class="form panel"><h1>إنشاء حساب عميل</h1><div id="m" class="msg"></div><label>الاسم الكامل</label><input id="name"><label>رقم الهاتف</label><input id="phone"><label>البريد الإلكتروني</label><input id="email" type="email"><label>كلمة المرور</label><input id="pass" type="password"><button id="go" class="btn" style="width:100%;margin-top:17px">إنشاء الحساب</button></div></main><script>
$("#go").onclick=async()=>{try{let name=$("#name").value.trim(),phone=$("#phone").value.trim(),email=$("#email").value.trim(),pass=$("#pass").value;if(!name||!phone||!email||pass.length<6)throw Error("أكمل البيانات وكلمة المرور 6 أحرف على الأقل.");let r=await db.auth.signUp({email,password:pass,options:{data:{account_type:"customer",name,phone}}});if(r.error)throw r.error;if(!r.data.user)throw Error("تعذر إنشاء الحساب.");let c=await db.from("customers").insert({id:r.data.user.id,phone,full_name:name,status:"active"});if(c.error)throw c.error;showMsg($("#m"),"تم إنشاء الحساب. يمكنك تسجيل الدخول.","success");setTimeout(()=>location.href="login.html",900)}catch(e){showMsg($("#m"),e.message)}};
</script></body></html>
