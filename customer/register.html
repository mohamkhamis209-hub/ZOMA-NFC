<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب | ZOMA</title><link rel="stylesheet" href="../assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script></head><body><div class="auth-wrap"><div class="panel auth"><a class="brand" href="../index.html"><span class="brand-badge">Z</span>ZOMA</a><h1>إنشاء حساب</h1><form id="f" class="form"><div class="grid-2"><div class="field"><label>الاسم الأول</label><input id="n1" required></div><div class="field"><label>الاسم الثاني</label><input id="n2" required></div><div class="field"><label>الاسم الثالث</label><input id="n3" required></div><div class="field"><label>اسم العائلة</label><input id="n4" required></div></div><div class="field"><label>رقم الهاتف</label><input id="phone" inputmode="tel" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" minlength="6" required></div><button class="btn primary">إنشاء الحساب</button></form><div class="help"><a class="link" href="login.html">لدي حساب بالفعل</a></div></div></div><script>
zoma.$('#f').addEventListener('submit',async e=>{e.preventDefault();const phone=zoma.$('#phone').value.trim();const full=[n1.value,n2.value,n3.value,n4.value].map(x=>x.trim()).join(' ');const email='phone_'+phone.replace(/\D/g,'')+'@zoma.local';const {data,error}=await sb.auth.signUp({email,password:password.value,options:{data:{full_name:full,phone}}});if(error){zoma.toast(error.message,'error');return}if(!data.user){zoma.toast('تعذر إنشاء الحساب','error');return}if(!data.session){zoma.toast('تم إنشاء الحساب. في بيئة الاختبار يجب تعطيل تأكيد البريد في Supabase Auth حتى يتم الدخول مباشرة.','error');return}await new Promise(r=>setTimeout(r,400));zoma.toast('تم إنشاء الحساب بنجاح','success');location.href='dashboard.html';});
</script></body></html>
