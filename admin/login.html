<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZOMA Admin</title><link rel="stylesheet" href="../assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script></head><body><header class="topbar"><a class="brand" href="../index.html"><span>Z</span>ZOMA ADMIN</a></header><main class="auth"><div class="form panel"><h1>دخول الإدارة</h1><p class="muted">حساب الإدارة من Supabase Authentication.</p><div id="m" class="msg"></div><label>البريد الإلكتروني</label><input id="email" type="email"><label>كلمة المرور</label><input id="pass" type="password"><button id="go" class="btn" style="width:100%;margin-top:17px">دخول</button></div></main><script>
$("#go").onclick=async()=>{try{const r=await db.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#pass").value});if(r.error)throw r.error;const u=await getUser();if(!await getAdmin(u.id)){await db.auth.signOut();throw Error("الحساب ليس له صلاحية Admin.");}location.href="dashboard.html"}catch(e){showMsg($("#m"),e.message)}};
</script></body></html>
